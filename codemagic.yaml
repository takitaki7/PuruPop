# Codemagic CI — builds and ships the iOS app without a Mac.
#
# Everything here runs on Codemagic's macOS machines, so the whole
# release path (build → sign → TestFlight) is reachable from a browser
# on Windows. Signing is handled by an App Store Connect API key, which
# is created on the App Store Connect website — no keychain, no CSR, and
# no local Xcode involved.
#
# One-time setup (all in a browser):
#   1. App Store Connect → Users and Access → Integrations → App Store
#      Connect API → create a key with "App Manager" access. Download the
#      .p8 once; note the Key ID and Issuer ID.
#   2. App Store Connect → Apps → create the app with bundle id
#      app.purupop.game (it must exist before the first upload).
#   3. codemagic.io → add this repository → Teams/Integrations → Apple
#      Developer Portal → add the key from step 1, naming the integration
#      exactly as `app_store_connect` below expects.
#   4. Start the `ios-release` workflow.

workflows:
  ios-release:
    name: PuruPop iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      # Must match the Apple Developer Portal integration name you create
      # in the Codemagic UI.
      app_store_connect: PuruPop ASC Key

    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "app.purupop.game"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.purupop.game

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets and sync into the iOS project
        # Also flips the ad provider to admob — see scripts/build-www.mjs.
        script: npm run ios:sync

      - name: Set the build number
        # App Store Connect rejects a build number it has already seen, so
        # this has to climb on every upload. BUILD_NUMBER is Codemagic's
        # own per-project counter, which does exactly that.
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight only. Flip submit_to_app_store when you're
        # ready for review — an automatic submission is not something to
        # trigger by accident.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          # Put your own address here to get build results by mail.
          - you@example.com
        notify:
          success: true
          failure: true
